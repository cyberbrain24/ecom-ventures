version: '3.8'

services:
  # 1. High-Performance Go Kernel API (:5000)
  ecom_api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ecom_api
    restart: always
    network_mode: "host" # Connects directly to localhost:5432 (Postgres), :6379 (Redis), and binds :5000
    env_file:
      - .env.production
    environment:
      - PORT=5000
    deploy:
      resources:
        limits:
          memory: 350M # Extremely safe ceiling for Go Monolith

  # 2. Next.js 14 Storefront Service (:5100)
  ecom_storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    container_name: ecom_storefront
    restart: always
    ports:
      - "5100:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_API_URL=http://host.docker.internal:5000/api/v1
    deploy:
      resources:
        limits:
          memory: 1200M # Next.js constrained to 1.2GB max

  # 3. Store & Master Admin SPAs (:5200)
  ecom_admin_server:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: ecom_admin_server
    restart: always
    ports:
      - "5200:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 250M # Lightweight Alpine Nginx SPA runner
