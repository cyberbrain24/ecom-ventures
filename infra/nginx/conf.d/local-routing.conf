# ==============================================================================
# 3. Dedicated API Virtual Host: api.dropiobd.localhost
# Direct gateway to the Go REST API modular monolith
# ==============================================================================
server {
    listen 80;
    server_name api.dropiobd.localhost;

    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-Host $http_host;
    }
}

# ==============================================================================
# 4. Multi-Tenant Shared Storefronts: Wildcard and Custom Brand Domains
# Handles mior.localhost, branda.localhost, brandb.localhost
# Forwards host context to Next.js SSR to resolve brand configuration
# ==============================================================================
server {
    listen 80;
    server_name ~^(?<subdomain>[a-zA-Z0-9_-]+)\.localhost$;

    # API Proxy pass-through for storefront shopping operations (cart, checkout, catalog)
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-Host $http_host;
    }

    # Next.js App Router dynamic SSR frontend
    location / {
        proxy_pass http://storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Domain $host;
    }
}
