# ==============================================================================
# 1. Platform Master Admin Virtual Host: master.dropiobd.localhost
# Directs super administrators to the central administration frontend
# ==============================================================================
server {
    listen 80;
    server_name master.dropiobd.localhost;

    # API Proxy pass-through for platform-level management endpoints
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-Host $http_host;
    }

    # Master Admin SPA frontend routing with Vite HMR WebSocket support
    location / {
        proxy_pass http://master_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# 2. Shared Store Admin Virtual Host: store.dropiobd.localhost
# Directs brand operators to their store administration interface
# Example URL path: store.dropiobd.localhost/mior
# ==============================================================================
server {
