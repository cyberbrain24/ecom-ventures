# ==============================================================================
# Ecom Ventures - Admin SPAs Internal Nginx Configuration (Port 5200)
# Serves Master Admin and Store Admin with Host-header differentiation
# Default / fallback returns Master Admin (200 OK)
# Reverse proxies /api/ requests to the Go API Kernel on port 5000
# ==============================================================================

server {
    listen 80 default_server;
    server_name _ master.* localhost 127.0.0.1 "";

    root /usr/share/nginx/html/master;
    index index.html;

    client_max_body_size 50M;

    # Reverse proxy API requests to Go Monolith Kernel
    location /api/ {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Health probe endpoint
    location = /healthz {
        access_log off;
        return 200 "admin-server ok\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 80;
    server_name admin.* store-admin.*;

    root /usr/share/nginx/html/store;
    index index.html;

    client_max_body_size 50M;

    # Reverse proxy API requests to Go Monolith Kernel
    location /api/ {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
