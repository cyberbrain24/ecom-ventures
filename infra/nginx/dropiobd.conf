# 4. Next.js Storefront (dropiobd.com, tenant subdomains, and all customer brand domains)
server {
    server_name dropiobd.com www.dropiobd.com *.dropiobd.com miorbd.com www.miorbd.com innerposh.com www.innerposh.com _;

    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate /etc/letsencrypt/live/dropiobd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dropiobd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Drop direct IP scans or requests without a valid domain name
    if ($host ~* "^[0-9.]+$") {
        return 444;
    }

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
