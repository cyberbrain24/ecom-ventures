# =========================================================================
# ECOM VENTURES (DROPIOBD.COM & CUSTOM DOMAINS) REVERSE PROXY CONFIGURATION
# Location on VPS: /etc/nginx/sites-available/dropiobd.conf
# Enabled Symlink: /etc/nginx/sites-enabled/dropiobd.conf
# =========================================================================

# 1. Master Platform Admin (master.dropiobd.com)
server {
    server_name master.dropiobd.com;

    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/letsencrypt/live/dropiobd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dropiobd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

