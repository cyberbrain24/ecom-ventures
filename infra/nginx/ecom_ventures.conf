# ==============================================================================
# Ecom Ventures - Nginx Host Reverse Proxy Configuration for Shared VPS
# Save location on VPS: /etc/nginx/sites-available/ecom_ventures
# Symlink: ln -s /etc/nginx/sites-available/ecom_ventures /etc/nginx/sites-enabled/
# Verify: nginx -t && systemctl reload nginx
# ==============================================================================

# 1. Ecom Go API Kernel (Port 5000)
server {
    server_name api.ecomventures.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}

# 2. Ecom Multi-Tenant Next.js Storefront (Port 5100)
server {
    server_name ecomventures.com *.ecomventures.com;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host; # Crucial: passes tenant subdomain/CNAME to Next.js middleware
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 80;
}

# 3. Store Merchant Admin SPA (Port 5200 or Static Root)
server {
    server_name admin.ecomventures.com;
    root /var/www/ecom_store_admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
}

# 4. Master Platform Admin SPA
server {
    server_name master.ecomventures.com;
    root /var/www/ecom_master_admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
}
