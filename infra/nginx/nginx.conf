# Core Nginx Configuration for Ecom Ventures Local Multi-Tenant Routing
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured JSON log format for local debugging and header verification
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"host":"$host",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream backend service definition
    upstream backend_api {
        server host.docker.internal:8080;
        keepalive 32;
    }

    # Upstream Master Admin application (Vite dev server)
    upstream master_admin_upstream {
        server host.docker.internal:5173;
        keepalive 32;
    }

    # Upstream Store Admin application (Vite dev server)
    upstream store_admin_upstream {
        server host.docker.internal:5174;
        keepalive 32;
    }

    # Upstream Shared Storefront application (Next.js server)
    upstream storefront_upstream {
        server host.docker.internal:3000;
        keepalive 32;
    }

    # Load virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}
