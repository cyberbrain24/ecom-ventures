version: '3.8'

networks:
  ecom_production_network:
    driver: bridge

volumes:
  prod_platform_postgres_data:
  prod_redis_data:
  prod_uploads_data:
  prod_backups_data:

services:
  # 1. Primary PostgreSQL Cluster (Platform DB + Dedicated Store DBs)
  production-db:
    image: postgres:16-alpine
    container_name: ecom_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PROD_DB_USER:-ecom_master_admin}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:?Database password required}
      POSTGRES_DB: ecom_platform_main
    volumes:
      - prod_platform_postgres_data:/var/lib/postgresql/data
    networks:
      - ecom_production_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USER:-ecom_master_admin} -d ecom_platform_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Cache, Sessions & Streams Broker
  production-redis:
    image: redis:7-alpine
    container_name: ecom_prod_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${PROD_REDIS_PASSWORD:?Redis password required}"]
    volumes:
      - prod_redis_data:/data
    networks:
      - ecom_production_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PROD_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Go Backend API Modular Monolith
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom_prod_api
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: 8080
      PLATFORM_DATABASE_URL: postgres://${PROD_DB_USER:-ecom_master_admin}:${PROD_DB_PASSWORD}@production-db:5432/ecom_platform_main?sslmode=disable
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:?32 byte key required}
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      REDIS_URL: production-redis:6379
      REDIS_PASSWORD: ${PROD_REDIS_PASSWORD}
      UPLOADS_DIR: /app/uploads
      APP_BASE_URL: https://api.dropiobd.com
    volumes:
      - prod_uploads_data:/app/uploads
      - prod_backups_data:/app/backups
    depends_on:
      production-db:
        condition: service_healthy
      production-redis:
        condition: service_healthy
    networks:
      - ecom_production_network

  # 4. Background Task Worker Daemon
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom_prod_worker
    restart: unless-stopped
    entrypoint: ["/app/bin/worker"]
    environment:
      APP_ENV: production
      PLATFORM_DATABASE_URL: postgres://${PROD_DB_USER:-ecom_master_admin}:${PROD_DB_PASSWORD}@production-db:5432/ecom_platform_main?sslmode=disable
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: production-redis:6379
      REDIS_PASSWORD: ${PROD_REDIS_PASSWORD}
    volumes:
      - prod_uploads_data:/app/uploads
      - prod_backups_data:/app/backups
    depends_on:
      backend-api:
        condition: service_started
    networks:
      - ecom_production_network

  # 5. Master Admin Portal (Vite + React Static App)
  master-admin:
    build:
      context: ./apps/master-admin
      dockerfile: Dockerfile
    container_name: ecom_prod_master_admin
    restart: unless-stopped
    networks:
      - ecom_production_network

  # 6. Shared Next.js Storefront (Dynamic Multi-Brand SSR)
  shared-storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    container_name: ecom_prod_storefront
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://api.dropiobd.com/api/v1
    depends_on:
      backend-api:
        condition: service_started
    networks:
      - ecom_production_network
