name: Ecom Ventures CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Automated Quality & Security Verification Hook
  verify:
    name: Code Quality & Automated Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Monorepo Workspaces Dependencies
        run: npm install

      - name: Run Master Verification Hook
        run: |
          chmod +x .agent/checks.sh
          bash .agent/checks.sh

      - name: Run Go Unit & Cross-Tenant Penetration Tests
        run: |
          cd backend
          go test -race -v ./...

      - name: Run TypeScript Static Type Analysis
        run: |
          npm --prefix apps/master-admin run check:types
          npm --prefix apps/storefront run check:types

  # Job 2: Build and Package Multi-Stage Docker Artifacts
  build-docker:
    name: Build Production Docker Images
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ecom-ventures/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Storefront Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/storefront
          file: ./apps/storefront/Dockerfile
          push: false
          tags: ecom-ventures/storefront:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Master Admin Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/master-admin
          file: ./apps/master-admin/Dockerfile
          push: false
          tags: ecom-ventures/master-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
